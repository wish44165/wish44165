name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card 1: General Stats 
      - name: Generate Base Stats
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.base.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: wish44165
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Australia/Melbourne
          
      # Card 2: Languages Breakdown
      - name: Generate Languages Stats
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: wish44165
          template: classic
          base: "" 
          plugin_languages: yes
